worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # iHerb cookies are large; give header buffers room.
    large_client_header_buffers 4 32k;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Hashed assets are immutable.
        location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback. Keep the sub-path in sync with vite.config.ts `base`.
        location /myaccount/subscription/panel {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /index.html;
        }

        # The HTML entry must never be cached, or users get stale asset hashes.
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }
}
