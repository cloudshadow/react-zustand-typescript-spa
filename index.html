<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>iHerb</title>
    <style>
      /*
       * Global reset lives here rather than in Linaria: truly global rules are
       * clearest as plain CSS, and this file is also the earliest possible place
       * for them (no flash before the bundle loads).
       * `lang` / `dir` above are placeholders -- bootstrap overwrites them from
       * the locale cookie.
       */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        font-family: FontBrandedPrimary, FontBrandedSecondary, FontBrandedFallback, sans-serif;
        font-size: 1rem;
        line-height: 1.5;
        color: rgb(25, 25, 25);
        background-color: #fff;
      }
      #app {
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
